# Versions are pinned so that every runtime dependency supports minSdk 21.
# Before bumping anything, check the new AAR's minSdk (see docs/DECISIONS.md D-005).
[versions]
agp = "9.4.1"
kotlin = "2.4.20"
coroutines = "1.11.0"
androidxCore = "1.17.0"        # 1.18+ needs minSdk 23
recyclerview = "1.4.0"         # last line with minSdk 21
zxing = "3.3.3"                # 3.4+ calls Java 8 library APIs missing below API 24 (D-025)
junit = "4.13.2"
androidxTestRunner = "1.7.0"   # 1.7.x is the newest line with minSdk 21
androidxTestCore = "1.7.0"
androidxTestExtJunit = "1.3.0"

[libraries]
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
androidx-core = { module = "androidx.core:core", version.ref = "androidxCore" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-lint = { id = "com.android.lint", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
