# On-demand performance run (references/performance.md): data generation at the chosen scale,
# the perf suite through instrumentation (query plans enforced) and through the release build's
# in-app runner, plus cold start — on API 21 (1 GB), API 29 (the store tablet's Android 10) and API 36.
# Reports are uploaded as artifacts and summarized on the run page. Start it from Actions → Performance → Run workflow.
name: Performance

on:
  workflow_dispatch:
    inputs:
      scale:
        description: Data scale (QUICK = 5k products / 80k lines, FULL = 50k products / 1M lines)
        type: choice
        options: [QUICK, FULL]
        default: FULL

permissions:
  contents: read

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
          mkdir -p apks
          cp app/build/outputs/apk/release/app-release.apk apks/
          cp app/build/outputs/apk/debug/app-debug.apk apks/
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk apks/
      - uses: actions/upload-artifact@v7
        with:
          name: perf-apks
          path: apks/
          retention-days: 7

  perf:
    name: Perf ${{ inputs.scale }} (API ${{ matrix.api }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 21
            ram: 1024M
          # Android 10: SQLite 3.22 and that Android's cursor windows, as on the store's tablet (D-058).
          - api: 29
            ram: 2048M
          - api: 36
            ram: 2048M
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: perf-apks
          path: apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          ram-size: ${{ matrix.ram }}
          disk-size: 4096M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash scripts/ci/perf.sh ${{ inputs.scale }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-${{ inputs.scale }}-api${{ matrix.api }}
          path: perf-results/
          retention-days: 30
