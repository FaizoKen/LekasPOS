# Publishes site/ (home page, user guide and privacy policy) to GitHub Pages:
# https://lekas.faizo.net/ — the privacy link for Google Play and the Google sign-in
# screen — and the manager web page (site/manager/, D-082). Plain HTML, no Jekyll; runs only when site/ changes.
# The pages are checked first (scripts/check-site.mjs: links, pictures, both guide languages alike), and the
# manager web page's tests run (scripts/manager/; the comparison with the app's own files runs in ci.yml).
name: Pages

on:
  push:
    branches: [main]
    paths: [site/**, scripts/check-site.mjs, scripts/manager/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the pages
        run: node scripts/check-site.mjs
      - name: Test the manager web page
        run: node --test scripts/manager/*.test.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
