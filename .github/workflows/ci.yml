# Build, JVM tests, lint and APK-size check on every push/PR, then the instrumented tests on the
# two emulator profiles that matter most: API 21 (Android 5.0, 1 GB — SQLite 3.8, the oldest
# planner we support) and API 36 (current target). Heavy work runs here, not on a laptop.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The app's release key (repository secrets; still named TEST_* from the tester days —
      # D-051), so every build installs over the previous one on everyone's phone. Not
      # available to pull requests from forks: those stay debug-signed.
      - name: Release signing key
        env:
          TEST_KEYSTORE_BASE64: ${{ secrets.TEST_KEYSTORE_BASE64 }}
          TEST_KEYSTORE_PASSWORD: ${{ secrets.TEST_KEYSTORE_PASSWORD }}
          TEST_KEY_ALIAS: ${{ secrets.TEST_KEY_ALIAS }}
        run: |
          if [ -n "$TEST_KEYSTORE_BASE64" ]; then
            echo "$TEST_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lekaspos-test.jks"
            {
              echo "storeFile=$RUNNER_TEMP/lekaspos-test.jks"
              echo "storePassword=$TEST_KEYSTORE_PASSWORD"
              echo "keyAlias=$TEST_KEY_ALIAS"
              echo "keyPassword=$TEST_KEYSTORE_PASSWORD"
              echo "keyKind=release"
            } > keystore.properties
            echo "Release APK signed with the release key" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release key available: release APK is debug-signed (not for anyone's phone)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build, test, lint
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:testDebugUnitTest :app:lintRelease \
            :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest \
            -Plekas.ciRun=${{ github.run_number }} --stacktrace

      - name: Release APK size (budget 8 MB)
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          size=$(stat -c%s "$apk")
          echo "Release APK: $size bytes ($((size / 1024)) KB) — budget 8 MB" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$size" -lt 8388608

      - name: Collect APKs
        run: |
          mkdir -p apks
          cp app/build/outputs/apk/release/app-release.apk apks/
          cp app/build/outputs/apk/debug/app-debug.apk apks/
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk apks/

      - uses: actions/upload-artifact@v7
        with:
          name: apks
          path: apks/
          retention-days: 14

      # R8's name map of this release APK, to read crash traces from testers and users; a public
      # release attaches it as mapping-<version>.txt (docs/BUILD.md, release checklist).
      - uses: actions/upload-artifact@v7
        with:
          name: mapping
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            core/build/reports/
            app/build/reports/
            core/build/test-results/
            app/build/test-results/
          retention-days: 14

  # The release (R8) APK must keep running after start — fresh and as an upgrade from the last
  # tester build. Separate from the instrumented tests (which use the debug build) and quick.
  release-smoke:
    name: Release smoke (API ${{ matrix.api }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 21
            ram: 1024M
          - api: 36
            ram: 2048M
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: apks
          path: apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PREV_APK_URL: https://github.com/FaizoKen/LekasPOS/releases/download/v1.13.0/LekasPOS-1.13.0.apk
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          ram-size: ${{ matrix.ram }}
          disk-size: 4096M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash scripts/ci/release-smoke.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-smoke-api${{ matrix.api }}
          path: results/

  # A 10-inch tablet in landscape (the usual counter setup): every screen opens, and the main
  # screens are captured in both languages for layout review.
  tablet:
    name: Tablet layout (API 36, landscape)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: apks
          path: apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_tablet
          ram-size: 2048M
          disk-size: 4096M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash scripts/ci/screenshots.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tablet
          path: results/

  instrumented:
    name: Instrumented tests (API ${{ matrix.api }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 21
            ram: 1024M
          - api: 36
            ram: 2048M
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: apks
          path: apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          ram-size: ${{ matrix.ram }}
          disk-size: 4096M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash scripts/ci/instrumented.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-api${{ matrix.api }}
          path: results/
          retention-days: 14
