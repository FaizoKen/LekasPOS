# The error-report relay (relay/, D-057): tested, then deployed to Cloudflare Workers when it
# changes on main (or by hand). Secrets: CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers"),
# REPORTS_TOKEN (fine-grained GitHub token: Issues read/write on
# FaizoKen/LekasPOS-reports only), which becomes the Worker's secret of the same name.
name: Report relay

on:
  push:
    branches: [main]
    paths: ['relay/**', '.github/workflows/relay.yml']
  pull_request:
    paths: ['relay/**', '.github/workflows/relay.yml']
  workflow_dispatch:

concurrency:
  group: relay-${{ github.ref }}

permissions:
  contents: read

jobs:
  relay:
    name: Test and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: node --test

      - name: Deploy
        id: deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          REPORTS_TOKEN: ${{ secrets.REPORTS_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$REPORTS_TOKEN" ]; then
            echo "Relay not deployed: the CLOUDFLARE_API_TOKEN or REPORTS_TOKEN secret is missing" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx --yes wrangler@4 deploy
          printf '%s' "$REPORTS_TOKEN" | npx --yes wrangler@4 secret put REPORTS_TOKEN
          echo "deployed=1" >> "$GITHUB_OUTPUT"

      # The relay answers a test report (checked, never filed) over the internet, as a till would.
      - name: Check
        if: steps.deploy.outputs.deployed == '1'
        run: |
          key=$(sed -n 's/^REPORT_KEY = "\(.*\)"/\1/p' wrangler.toml)
          body='{"v":1,"kind":"error","fp":"0000000000000000","install":"0000000000000000","app":"0.0.0","build":1,"title":"relay check"}'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://lekaspos-reports.faizoken.workers.dev/v1/report \
            -H "x-lekas-key: $key" -H 'x-lekas-test: 1' -H 'content-type: application/json' --data "$body")
          echo "Relay answered $code" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$code" = 204
